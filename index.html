<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padronização de Fatiados - Frios</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
    
    <style>
        /* ESTILIZAÇÃO DO PDF ISOLADA COM BORDAS E CORES FIÉIS AO SEU MODELO */
        #main-pdf-wrapper {
            background-color: #ffffff !important;
            color: #000000 !important;
            font-family: Arial, sans-serif !important;
            padding: 10px !important;
        }

        .pdf-category-banner {
            background-color: #1e293b !important;
            color: #ffffff !important;
            padding: 6px 10px !important;
            font-size: 11pt !important;
            font-weight: bold !important;
            text-transform: uppercase !important;
            margin-top: 15px !important;
            margin-bottom: 5px !important;
        }

        /* Estrutura de tabela em grade forte (linhas verticais e horizontais bem marcadas) */
        table.grid-pdf-table {
            width: 100% !important;
            border-collapse: collapse !important;
            margin-bottom: 20px !important;
            background-color: #ffffff !important;
        }

        /* Cabeçalho Azul do seu modelo com texto destacado */
        table.grid-pdf-table th {
            background-color: #7dd3fc !important; /* Azul claro operacional bem legível */
            color: #000000 !important;
            font-weight: bold !important;
            text-transform: uppercase !important;
            font-size: 9.5pt !important;
            padding: 6px !important;
            border: 1px solid #000000 !important; /* Grade preta definida */
            text-align: center !important;
        }

        table.grid-pdf-table td {
            padding: 6px !important;
            border: 1px solid #000000 !important; /* Força todas as linhas da grade */
            font-size: 9pt !important;
            color: #000000 !important;
            background-color: #ffffff !important;
        }

        /* Linha do Produto Matriz/Pai - Amarelo Destaque do seu print */
        table.grid-pdf-table tr.pdf-row-base td {
            background-color: #fef08a !important; /* Amarelo/Dourado Suave */
            font-weight: bold !important;
            font-size: 9.5pt !important;
            color: #000000 !important;
        }

        /* Linhas das variações fatiadas abaixo da matriz */
        table.grid-pdf-table tr.pdf-row-related td {
            background-color: #ffffff !important;
            color: #000000 !important;
        }

        .page-break-avoid { 
            page-break-inside: avoid !important; 
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen font-sans">

    <nav class="bg-slate-800 text-white shadow-md no-print">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
                📦 Padronização de Fatiados
            </h1>
            <div class="flex items-center gap-4">
                <button id="btnPrint" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 cursor-pointer">
                    🖨️ Imprimir PDF em Grade Otimizada
                </button>
                <button id="btnAdminAuth" class="text-slate-500 hover:text-slate-300 text-xs font-mono transition tracking-widest focus:outline-none cursor-pointer">
                    [ADM]
                </button>
                <span id="adminStatus" class="hidden text-xs bg-green-500/20 text-green-400 px-2 py-1 rounded border border-green-500/30 font-mono">
                    Sessão ADM Ativa
                </span>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6">

        <section id="adminSection" class="hidden bg-white rounded-xl shadow-md p-6 mb-8 border border-slate-200 no-print">
            <div class="flex justify-between items-center mb-6 border-b border-gray-100 pb-3">
                <h2 id="formTitle" class="text-lg font-bold text-slate-700 flex items-center gap-2">
                    ✨ Cadastrar Novo Produto Base
                </h2>
                <div class="flex items-center gap-4">
                    <label class="flex items-center gap-2 text-sm font-semibold text-slate-600 cursor-pointer">
                        <input type="checkbox" id="productActive" checked class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                        Produto Ativo para Compra/Painel
                    </label>
                    <button id="btnCancelEdit" class="hidden text-sm text-red-500 hover:underline cursor-pointer">
                        Cancelar Edição
                    </button>
                </div>
            </div>

            <form id="productForm" class="space-y-6">
                <input type="hidden" id="productId">
                
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Categoria</label>
                        <input type="text" id="categoryName" required placeholder="Ex: QUEIJO PROVOLONE" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Nome do Produto Base</label>
                        <input type="text" id="baseName" required placeholder="Ex: PROVOLONE MARCA X" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Código Base (Texto)</label>
                        <input type="text" id="baseCode" required placeholder="Ex: PROVOLONE PEÇA" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Código Interno/PLU</label>
                        <input type="number" id="baseIdCode" required placeholder="Ex: 4144" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">URL da Foto do Base (Internet)</label>
                        <input type="url" id="baseImageUrl" placeholder="https://linkdaimagem.com/foto.jpg" class="w-full bg-white border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Ou Importar da Galeria/Computador</label>
                        <input type="file" id="baseImageFile" accept="image/*" class="w-full bg-white border border-gray-300 rounded-lg p-1.5 file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-white hover:file:bg-slate-800">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-sm font-bold uppercase tracking-wider text-slate-600">📦 Subprodutos Relacionados</h3>
                        <button type="button" id="btnAddRelated" class="bg-slate-700 hover:bg-slate-800 text-white text-xs font-bold px-3 py-1.5 rounded transition flex items-center gap-1 cursor-pointer">
                            ➕ Adicionar Relacionado
                        </button>
                    </div>
                    
                    <div id="relatedContainer" class="space-y-4">
                        </div>
                </div>

                <div class="flex justify-end pt-4 border-t border-gray-100">
                    <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold px-6 py-2.5 rounded-lg shadow transition cursor-pointer">
                        💾 Salvar Produto e Relacionados
                    </button>
                </div>
            </form>
        </section>

        <section id="pdfPrintArea" class="hidden">
            <div id="main-pdf-wrapper">
                <div style="text-align: center; font-size: 14pt; font-weight: bold; border-bottom: 2px solid #000000; padding-bottom: 5px; margin-bottom: 15px;">
                    TABELA GERAL DE PADRONIZAÇÃO DE FRIOS FATIADOS
                </div>
                <div id="pdfTablesContainer">
                    </div>
            </div>
        </section>

        <section id="webPanelArea">
            <div id="categoriesContainer" class="space-y-8">
                <div class="text-center py-12 text-gray-500 no-print">
                    🔄 Carregando painel de categorias e produtos...
                </div>
            </div>
        </section>

    </main>

    <template id="relatedTemplate">
        <div class="related-item bg-white p-4 rounded-lg border-2 border-dashed border-gray-300 relative grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-3 pt-8">
            <button type="button" class="btn-remove-related absolute top-2 right-2 text-red-500 hover:text-red-700 text-sm font-bold focus:outline-none cursor-pointer" title="Remover subproduto">
                ✕ Remover
            </button>
            <div class="md:col-span-2">
                <label class="block text-[10px] font-bold uppercase text-gray-400 mb-0.5">Descrição do Relacionado</label>
                <input type="text" class="rel-name w-full border border-gray-300 rounded p-1.5 text-sm outline-none" required placeholder="Ex: FATIADA">
            </div>
            <div>
                <label class="block text-[10px] font-bold uppercase text-gray-400 mb-0.5">Código PLU/EAN</label>
                <input type="number" class="rel-code w-full border border-gray-300 rounded p-1.5 text-sm outline-none" required placeholder="Ex: 1612">
            </div>
            <div>
                <label class="block text-[10px] font-bold uppercase text-gray-400 mb-0.5">Quantidade</label>
                <input type="text" class="rel-qty w-full border border-gray-300 rounded p-1.5 text-sm outline-none" placeholder="Ex: MIN. 7 FATIAS">
            </div>
            <div>
                <label class="block text-[10px] font-bold uppercase text-gray-400 mb-0.5">Bandeja / Embalagem</label>
                <input type="text" class="rel-package w-full border border-gray-300 rounded p-1.5 text-sm outline-none" placeholder="Ex: BASE PRANCHA OBLEA 02">
            </div>
            <div>
                <label class="block text-[10px] font-bold uppercase text-gray-400 mb-0.5">Tara (g)</label>
                <input type="text" class="rel-tara w-full border border-gray-300 rounded p-1.5 text-sm outline-none" placeholder="Ex: 6g">
            </div>
            <div class="md:col-span-3 lg:col-span-6 bg-slate-50 p-2 rounded border border-gray-200 grid grid-cols-1 md:grid-cols-3 gap-2">
                <div class="md:col-span-1">
                    <label class="block text-[10px] font-bold uppercase text-gray-400 mb-0.5">Foto (Internet Link)</label>
                    <input type="url" class="rel-img w-full border border-gray-300 rounded p-1 text-xs outline-none" placeholder="https://...">
                </div>
                <div class="md:col-span-1">
                    <label class="block text-[10px] font-bold uppercase text-gray-400 mb-0.5">Ou da Galeria/Arquivo</label>
                    <input type="file" accept="image/*" class="rel-file w-full bg-white border border-gray-300 rounded p-0.5 text-xs">
                    <input type="hidden" class="rel-base64">
                </div>
                <div class="md:col-span-1 flex flex-col justify-end">
                    <div class="text-[10px] text-gray-400 italic preview-status">Sem imagem local selecionada</div>
                </div>
            </div>
            <div class="md:col-span-3 lg:col-span-6">
                <label class="block text-[10px] font-bold uppercase text-gray-400 mb-0.5">Tipo de Arrumação / Padrão</label>
                <input type="text" class="rel-setup w-full border border-gray-300 rounded p-1.5 text-sm outline-none" placeholder="Ex: ESCAMADO CONT.">
            </div>
        </div>
    </template>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyA45RskefgyL5QpyhUwrqDaE4P20Z2Vm_M",
            authDomain: "painel-frios-fatiados.firebaseapp.com",
            projectId: "painel-frios-fatiados",
            storageBucket: "painel-frios-fatiados.firebasestorage.app",
            messagingSenderId: "50969295695",
            appId: "1:50969295695:web:fd51bf5a5016a9e866a33a",
            measurementId: "G-C4E9EC43QJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app, "https://painel-frios-fatiados-default-rtdb.firebaseio.com/");

        // Referências DOM
        const btnAdminAuth = document.getElementById('btnAdminAuth');
        const adminStatus = document.getElementById('adminStatus');
        const adminSection = document.getElementById('adminSection');
        const productForm = document.getElementById('productForm');
        const relatedContainer = document.getElementById('relatedContainer');
        const btnAddRelated = document.getElementById('btnAddRelated');
        const categoriesContainer = document.getElementById('categoriesContainer');
        const formTitle = document.getElementById('formTitle');
        const productIdInput = document.getElementById('productId');
        const productActiveCheckbox = document.getElementById('productActive');
        const btnCancelEdit = document.getElementById('btnCancelEdit');
        const btnPrint = document.getElementById('btnPrint');
        const pdfPrintArea = document.getElementById('pdfPrintArea');
        const pdfTablesContainer = document.getElementById('pdfTablesContainer');
        const relatedTemplate = document.getElementById('relatedTemplate');

        let IS_ADMIN = false;
        let base64ImageString = "";
        let cachedProducts = {};

        // --- AUTENTICAÇÃO TEMPORAL (2 HORAS) ---
        function checkAdminSession() {
            const loginTime = localStorage.getItem('admin_session_time');
            const adminUser = localStorage.getItem('admin_user');
            
            if (loginTime && adminUser === 'au.costa') {
                const hoursPassed = (Date.now() - parseInt(loginTime)) / (1000 * 60 * 60);
                if (hoursPassed < 2) {
                    activateAdminMode();
                    return;
                }
            }
            deactivateAdminMode();
        }

        function activateAdminMode() {
            IS_ADMIN = true;
            adminStatus.classList.remove('hidden');
            adminSection.classList.remove('hidden');
            renderDashboard(); 
        }

        function deactivateAdminMode() {
            IS_ADMIN = false;
            adminStatus.classList.add('hidden');
            adminSection.classList.add('hidden');
            localStorage.removeItem('admin_session_time');
            localStorage.removeItem('admin_user');
            renderDashboard();
        }

        btnAdminAuth.addEventListener('click', () => {
            const user = prompt("Digite o usuário de acesso Administrador:");
            if (user === "au.costa") {
                localStorage.setItem('admin_session_time', Date.now().toString());
                localStorage.setItem('admin_user', user);
                activateAdminMode();
                alert("Modo Administrador ativo por 2 horas.");
            } else if (user !== null) {
                alert("Usuário incorreto.");
            }
        });

        document.getElementById('baseImageFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) { base64ImageString = event.target.result; };
                reader.readAsDataURL(file);
            }
        });

        function createRelatedRow(data = null) {
            const clone = relatedTemplate.content.cloneNode(true);
            const row = clone.querySelector('.related-item');
            const fileInput = row.querySelector('.rel-file');
            const hiddenBase64 = row.querySelector('.rel-base64');
            const previewStatus = row.querySelector('.preview-status');
            
            if (data) {
                row.querySelector('.rel-name').value = data.name || '';
                row.querySelector('.rel-code').value = data.code || '';
                row.querySelector('.rel-qty').value = (data.qty === "N/A" || !data.qty) ? "" : data.qty;
                row.querySelector('.rel-package').value = (data.package === "N/A" || !data.package) ? "" : data.package;
                row.querySelector('.rel-tara').value = (data.tara === "N/A" || !data.tara) ? "" : data.tara;
                row.querySelector('.rel-setup').value = (data.setup === "N/A" || !data.setup) ? "" : data.setup;
                
                if (data.img && data.img.startsWith('data:image')) {
                    hiddenBase64.value = data.img;
                    previewStatus.innerText = "📸 Foto da Galeria Salva";
                    previewStatus.classList.add("text-green-600");
                } else {
                    row.querySelector('.rel-img').value = data.img || '';
                }
            }

            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        hiddenBase64.value = event.target.result;
                        previewStatus.innerText = "📸 Imagem Pronta";
                        previewStatus.classList.add("text-green-600");
                    };
                    reader.readAsDataURL(file);
                }
            });

            row.querySelector('.btn-remove-related').addEventListener('click', () => row.remove());
            relatedContainer.appendChild(row);
        }

        btnAddRelated.addEventListener('click', () => createRelatedRow());

        // --- SALVAR / ATUALIZAR ---
        productForm.addEventListener('submit', function(e) {
            e.preventDefault();
            if (!IS_ADMIN) return alert("Sem permissão.");

            const id = productIdInput.value;
            const finalImageUrl = base64ImageString || document.getElementById('baseImageUrl').value || 'https://images.unsplash.com/photo-1553177595-4de2bb0842b9?q=80&w=200&auto=format&fit=crop';

            const relatedItems = [];
            document.querySelectorAll('.related-item').forEach(item => {
                const nameVal = item.querySelector('.rel-name').value.toUpperCase().trim();
                const codeVal = item.querySelector('.rel-code').value.trim();
                const qtyVal = item.querySelector('.rel-qty').value.trim();
                const pkgVal = item.querySelector('.rel-package').value.trim();
                const taraVal = item.querySelector('.rel-tara').value.trim();
                const setupVal = item.querySelector('.rel-setup').value.trim();

                relatedItems.push({
                    name: nameVal,
                    code: codeVal,
                    qty: (qtyVal === "N/A" || qtyVal === "") ? "" : qtyVal,
                    package: (pkgVal === "N/A" || pkgVal === "") ? "" : pkgVal,
                    tara: (taraVal === "N/A" || taraVal === "") ? "" : taraVal,
                    setup: (setupVal === "N/A" || setupVal === "") ? "" : setupVal,
                    img: item.querySelector('.rel-base64').value || item.querySelector('.rel-img').value || ""
                });
            });

            const productData = {
                categoryName: document.getElementById('categoryName').value.toUpperCase().trim(),
                baseName: document.getElementById('baseName').value.toUpperCase().trim(),
                baseCode: document.getElementById('baseCode').value.toUpperCase().trim(),
                baseIdCode: document.getElementById('baseIdCode').value.trim(),
                imageUrl: finalImageUrl,
                active: productActiveCheckbox.checked,
                related: relatedItems
            };

            if (id) {
                update(ref(db, 'products/' + id), productData).then(() => alert("Atualizado com sucesso!"));
            } else {
                set(push(ref(db, 'products')), productData).then(() => alert("Cadastrado com sucesso!"));
            }
            resetForm();
        });

        function resetForm() {
            productForm.reset();
            productIdInput.value = "";
            base64ImageString = "";
            relatedContainer.innerHTML = "";
            productActiveCheckbox.checked = true;
            formTitle.innerText = "✨ Cadastrar Novo Produto Base";
            btnCancelEdit.classList.add('hidden');
        }

        btnCancelEdit.addEventListener('click', resetForm);

        // --- RENDERIZAÇÃO DO DASHBOARD WEB ---
        function renderDashboard() {
            categoriesContainer.innerHTML = "";
            const keys = Object.keys(cachedProducts);

            if (keys.length === 0) {
                categoriesContainer.innerHTML = `<div class="bg-white p-8 text-center text-gray-500 rounded-xl border">Nenhum produto cadastrado.</div>`;
                return;
            }

            const grouped = {};
            keys.forEach(key => {
                const p = cachedProducts[key];
                if (p.active === false && !IS_ADMIN) return; 

                const cat = p.categoryName || "SEM CATEGORIA";
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push({ id: key, ...p });
            });

            Object.keys(grouped).sort().forEach(categoryTitle => {
                if(grouped[categoryTitle].length === 0) return;

                const categoryBox = document.createElement('div');
                categoryBox.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-300";
                categoryBox.innerHTML = `
                    <div class="border-b-4 border-slate-700 pb-2 mb-4">
                        <h2 class="text-xl font-black tracking-wider text-slate-800 uppercase">📂 Categoria: ${categoryTitle}</h2>
                    </div>
                    <div class="product-list-container grid grid-cols-1 gap-4"></div>
                `;

                const listContainer = categoryBox.querySelector('.product-list-container');

                grouped[categoryTitle].forEach(product => {
                    const isInactive = product.active === false;
                    const card = document.createElement('div');
                    
                    card.className = `rounded-lg border overflow-hidden transition duration-200 product-card ${
                        isInactive ? 'border-red-500 bg-red-50' : 'border-gray-200 bg-white'
                    }`;
                    
                    card.innerHTML = `
                        <div class="p-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 ${isInactive ? 'bg-red-100/50' : 'bg-slate-50'} border-b border-gray-100">
                            <div class="flex items-center gap-4 cursor-pointer flex-1 w-full structure-trigger" data-id="${product.id}">
                                <img src="${product.imageUrl}" class="w-14 h-14 object-cover rounded-lg border bg-white shrink-0 shadow-sm" alt="Foto">
                                <div>
                                    <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                                        ${product.baseName} 
                                        ${isInactive ? '<span class="text-xs bg-red-600 text-white px-2 py-0.5 rounded font-black tracking-wider animate-pulse">[ INATIVO ]</span>' : ''}
                                    </h3>
                                    <p class="text-xs text-slate-500 font-medium">${product.baseCode} — <span class="bg-slate-200 px-2 py-0.5 rounded text-slate-700 font-mono text-xs font-bold">${product.baseIdCode}</span></p>
                                </div>
                            </div>
                            
                            <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end">
                                <span class="text-xs font-semibold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full">
                                    ${product.related ? product.related.length : 0} Relacionados
                                </span>
                                <div class="flex gap-2 ${IS_ADMIN ? '' : 'hidden'}">
                                    <button onclick="window.editProduct('${product.id}')" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-2.5 py-1.5 rounded transition cursor-pointer">Editar</button>
                                    <button onclick="window.deleteProduct('${product.id}')" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-2.5 py-1.5 rounded transition cursor-pointer">Excluir</button>
                                </div>
                            </div>
                        </div>

                        <div id="details-${product.id}" class="hidden p-4 bg-white border-t border-gray-100">
                            <div class="grid grid-cols-1 gap-3">
                                ${product.related ? product.related.map(rel => `
                                    <div class="flex flex-col md:flex-row gap-4 p-3 rounded-lg bg-gray-50 border border-gray-200 shadow-inner">
                                        ${rel.img ? `<img src="${rel.img}" class="w-14 h-14 object-cover rounded border bg-white shrink-0" alt="Corte">` : ''}
                                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-2 flex-1 text-xs">
                                            <div class="sm:col-span-2 lg:col-span-2">
                                                <span class="font-bold text-gray-400 uppercase block text-[9px]">Subproduto</span>
                                                <span class="text-xs font-bold text-slate-700">${rel.name}</span>
                                            </div>
                                            <div>
                                                <span class="font-bold text-gray-400 uppercase block text-[9px]">Código PLU/EAN</span>
                                                <span class="text-xs font-mono font-bold bg-gray-200 px-1.5 py-0.5 rounded text-gray-700">${rel.code}</span>
                                            </div>
                                            <div>
                                                <span class="font-bold text-gray-400 uppercase block text-[9px]">Peso / Qtd</span>
                                                <span class="text-xs font-medium text-slate-600">${(rel.qty === "N/A" || !rel.qty) ? "" : rel.qty}</span>
                                            </div>
                                            <div>
                                                <span class="font-bold text-gray-400 uppercase block text-[9px]">Embalagem / Tara</span>
                                                <span class="text-xs font-medium text-slate-600">${(rel.package === "N/A" || !rel.package) ? "" : rel.package} ${(rel.tara && rel.tara !== "N/A") ? `(Tara: ${rel.tara})` : ''}</span>
                                            </div>
                                            <div class="sm:col-span-2 lg:col-span-5 bg-white p-2 rounded border border-gray-100 mt-1">
                                                <span class="font-bold text-gray-400 uppercase block text-[9px] mb-0.5">Padrão de Arrumação Operacional</span>
                                                <span class="text-xs text-slate-600">${(rel.setup === "N/A" || !rel.setup) ? "" : rel.setup}</span>
                                            </div>
                                        </div>
                                    </div>
                                `).join('') : '<p class="text-gray-400 italic text-xs">Nenhum subproduto cadastrado.</p>'}
                            </div>
                        </div>
                    `;

                    card.querySelector('.structure-trigger').addEventListener('click', () => {
                        document.getElementById(`details-${product.id}`).classList.toggle('hidden');
                    });

                    listContainer.appendChild(card);
                });

                categoriesContainer.appendChild(categoryBox);
            });
        }

        onValue(ref(db, 'products'), (snapshot) => {
            cachedProducts = snapshot.val() || {};
            renderDashboard();
        });

        // --- EXPONDO EXPLICITAMENTE AS FUNÇÕES DE EDIÇÃO E EXCLUSÃO PARA O ESCOPO GLOBAL (WINDOW) ---
        window.deleteProduct = function(id) {
            if (confirm("Remover este produto base e todos os seus relacionados?")) {
                remove(ref(db, 'products/' + id)).then(() => alert("Removido com sucesso."));
            }
        };

        window.editProduct = function(id) {
            const product = cachedProducts[id];
            if (!product) return;

            productIdInput.value = id;
            document.getElementById('categoryName').value = product.categoryName || '';
            document.getElementById('baseName').value = product.baseName;
            document.getElementById('baseCode').value = product.baseCode;
            document.getElementById('baseIdCode').value = product.baseIdCode;
            document.getElementById('baseImageUrl').value = product.imageUrl.startsWith('data:image') ? "" : product.imageUrl;
            productActiveCheckbox.checked = product.active !== false;
            
            base64ImageString = product.imageUrl.startsWith('data:image') ? product.imageUrl : "";

            relatedContainer.innerHTML = "";
            if (product.related) {
                product.related.forEach(rel => createRelatedRow(rel));
            }

            formTitle.innerText = `📝 Editando: ${product.baseName}`;
            btnCancelEdit.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // --- SISTEMA DE ESTRUTURAÇÃO DO PDF EM GRADE COMPLETA (FIEL AO SEU SEGUNDO PRINT) ---
        function generateCompactPdfStructure() {
            pdfTablesContainer.innerHTML = "";
            const keys = Object.keys(cachedProducts);

            const grouped = {};
            keys.forEach(key => {
                const p = cachedProducts[key];
                if (p.active === false) return; 

                const cat = p.categoryName || "SEM CATEGORIA";
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(p);
            });

            Object.keys(grouped).sort().forEach(category => {
                const catWrapper = document.createElement('div');
                catWrapper.className = "page-break-avoid";

                let rowsHtml = "";
                grouped[category].forEach(prod => {
                    // Linha Matriz Amarela Completa da Grade Divisória igual ao seu modelo
                    rowsHtml += `
                        <tr class="pdf-row-base">
                            <td style="text-align: left !important; font-weight: bold;">${prod.baseName}</td>
                            <td style="text-align: center !important; font-family: monospace !important; font-weight: bold;">${prod.baseIdCode}</td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                    `;

                    // Linhas das Variações Relacionadas limpas
                    if (prod.related && prod.related.length > 0) {
                        prod.related.forEach(rel => {
                            const cleanName = (rel.name && rel.name !== "N/A") ? rel.name : "";
                            const cleanCode = (rel.code && rel.code !== "N/A") ? rel.code : "";
                            const cleanQty = (rel.qty && rel.qty !== "N/A") ? rel.qty : "";
                            const cleanPkg = (rel.package && rel.package !== "N/A") ? rel.package : "";
                            const cleanTara = (rel.tara && rel.tara !== "N/A") ? rel.tara : "";
                            const cleanSetup = (rel.setup && rel.setup !== "N/A") ? rel.setup : "";

                            rowsHtml += `
                                <tr class="pdf-row-related">
                                    <td style="text-align: left !important; padding-left: 15px !important;">${cleanName}</td>
                                    <td style="text-align: center !important; font-family: monospace !important;">${cleanCode}</td>
                                    <td style="text-align: center !important;">${cleanQty}</td>
                                    <td style="text-align: left !important;">${cleanPkg}</td>
                                    <td style="text-align: center !important;">${cleanTara}</td>
                                    <td style="text-align: left !important;">${cleanSetup}</td>
                                </tr>
                            `;
                        });
                    }
                });

                // Estruturação do cabeçalho azul em HTML Puro contra interrupções do Framework
                catWrapper.innerHTML = `
                    <div class="pdf-category-banner">📂 CATEGORIA: ${category}</div>
                    <table class="grid-pdf-table">
                        <thead>
                            <tr>
                                <th style="width: 32% !important; text-align: left !important;">${category}</th>
                                <th style="width: 12% !important; text-align: center !important;">CÓDIGO</th>
                                <th style="width: 14% !important; text-align: center !important;">QUANTIDADE</th>
                                <th style="width: 16% !important; text-align: left !important;">BANDEJA</th>
                                <th style="width: 8% !important; text-align: center !important;">TARA</th>
                                <th style="width: 18% !important; text-align: left !important;">ARRUMAÇÃO</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                        </tbody>
                    </table>
                `;
                pdfTablesContainer.appendChild(catWrapper);
            });
        }

        // --- DISPARADOR DO PDF ---
        btnPrint.addEventListener('click', () => {
            generateCompactPdfStructure();
            pdfPrintArea.classList.remove('hidden');

            const opt = {
                margin:       [10, 10, 10, 10],
                filename:     'Tabela_Padronizacao_Frios.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { 
                    scale: 2, 
                    useCORS: true,
                    logging: false,
                    letterRendering: true
                },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            setTimeout(() => {
                html2pdf().set(opt).from(pdfPrintArea).save().then(() => {
                    pdfPrintArea.classList.add('hidden');
                }).catch(err => {
                    alert("Erro ao exportar PDF: " + err);
                    pdfPrintArea.classList.add('hidden');
                });
            }, 500);
        });

        checkAdminSession();
    </script>
</body>
</html>
